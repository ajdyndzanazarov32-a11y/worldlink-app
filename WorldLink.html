<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WorldLink</title>
<style>
:root{--bg:#f6f5fa;--card:#fff;--tx:#1d1b2b;--mu:#6b6880;--pu:#7047EB;--pt:#7047EB;--li:#B7F36B;--bd:#e4e1f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c30;--tx:#f1eefc;--mu:#a9a6c2;--pt:#b5a0ff;--bd:#352f50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c30;--tx:#f1eefc;--mu:#a9a6c2;--pt:#b5a0ff;--bd:#352f50;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
h2{margin:.3em 0}button,input,select,textarea{font:inherit;color:inherit}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:4px 2px;border-radius:14px;font-size:11px;min-height:46px;color:var(--mu);cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400;line-height:1.2}
nav button.on{background:var(--li);color:#1d1b2b;font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 14px 100px}
.top{font-weight:800;font-size:22px;color:var(--pt)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:10px 0}
.b{background:var(--pu);color:#fff;border:0;border-radius:12px;padding:8px 14px;min-height:40px;cursor:pointer}
.g{background:none;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px}
:focus-visible{outline:2px solid var(--pu);outline-offset:2px}
.t{display:inline-block;background:var(--li);color:#1d1b2b;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:0;width:auto}.row>select{width:auto}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.m{max-width:88%;padding:8px 12px;border-radius:16px;margin:6px 0;background:var(--bg);border:1px solid var(--bd)}
.m.me{margin-left:auto;background:var(--pu);color:#fff;border:0}
.s{font-size:12px;color:var(--mu)}.me .s{color:#e8e1ff}
#to{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1d1b2b;color:#fff;padding:8px 14px;border-radius:12px;display:none;z-index:9;max-width:90%}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:160px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:24px 8px}main{margin-left:190px;padding-bottom:40px}#to{bottom:30px}}
</style></head><body>
<nav aria-label="Main"></nav><main id="app"></main><div id="to" role="status"></div>
<script>
const TB=[["home","🏠","Home"],["explore","🧭","Explore"],["chats","💬","Chats"],["mentor","🤖","AI Mentor"],["vocab","📚","Vocabulary"],["profile","👤","Profile"]];
const LG=["English","Japanese","Spanish","French","Portuguese","Arabic","Russian","Kazakh","German","Chinese","Korean"];
const U=[{id:"mei",n:"Mei",c:"Japan",nat:"Japanese",lrn:["English"],i:["anime","cooking","travel"]},{id:"lucas",n:"Lucas",c:"Brazil",nat:"Portuguese",lrn:["English","Spanish"],i:["football","music","travel"]},{id:"amira",n:"Amira",c:"Egypt",nat:"Arabic",lrn:["French"],i:["books","cooking","art"]},{id:"sofia",n:"Sofia",c:"Spain",nat:"Spanish",lrn:["English","Japanese"],i:["music","film","travel"]},{id:"dan",n:"Dan",c:"UK",nat:"English",lrn:["Japanese"],i:["anime","gaming","football"]}];
const K={"break the ice":["English","start a friendly conversation","I told a joke to break the ice.","An idiom for easing the awkward start when people first meet."],"no worries":["English","it’s fine, don’t mention it","A: Sorry I’m late! B: No worries!","A casual reply to thanks or an apology."],"spill the tea":["English","share gossip","Come on, spill the tea!","Informal slang."],"はじめまして":["Japanese","nice to meet you","はじめまして、Meiです。","Polite phrase for meeting someone for the first time."],"お疲れ様です":["Japanese","thank you for your hard work","お疲れ様です！","Greeting between colleagues or after work."]};
const D={me:{name:"you",bio:"",native:"English",learning:["Japanese"],interests:["travel","music"],pub:true,theme:"auto"},follow:[],friends:[],sent:[],reqs:["sofia","dan"],liked:[],saved:[],cm:{},
posts:[{id:1,u:"mei",x:"Learning “no worries” today. People say it all the time!",lk:3},{id:2,u:"lucas",x:"Anyone want to practice Spanish and English together?",lk:5},{id:3,u:"amira",x:"Bonjour! Today I learned how to order coffee in French.",lk:2}],
chats:{mei:[{f:"mei",o:"はじめまして！英語を勉強しています。",t:"Nice to meet you! I’m studying English.",l:"Japanese",at:"09:12"},{f:"mei",o:"週末は何をしますか？",t:"What are you doing this weekend?",l:"Japanese",at:"09:13"}],lucas:[{f:"lucas",o:"Bora tomar um café?",t:"Want to grab a coffee?",l:"Portuguese",at:"10:40"}]},
vocab:[],mentor:[],mm:{lang:"English",lv:"B1",mode:"explain"}};
let S;try{S=JSON.parse(localStorage.getItem("wl")||"null")}catch(x){}
S=Object.assign(structuredClone(D),S||{});
const X={ex:"discover",q:"",lg:"",chat:null,vq:"",vl:"",vs:"",ed:null,fc:false,fi:0,rv:false,pre:"",pe:false,cm:null,so:{}};
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem("wl",JSON.stringify(S))}catch(x){}};
const toast=m=>{const t=$("#to");t.textContent=m;t.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display="none",2600)};
const go=t=>{location.hash=t},R=()=>{const t=location.hash.slice(1);return TB.some(b=>b[0]===t)?t:"home"};
const u=id=>id==="me"?{n:S.me.name}:U.find(x=>x.id===id),now=()=>new Date().toTimeString().slice(0,5);
const av=n=>`<div class="av" style="background:hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 55% 40%)">${E((n[0]||"?").toUpperCase())}</div>`;
const tag=a=>a.map(x=>`<span class="t">${E(x)}</span>`).join("");
const sp=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
const opt=(a,v)=>a.map(l=>`<option ${l===v?"selected":""}>${l}</option>`).join("");
const th=()=>{const e=document.documentElement;S.me.theme==="auto"?e.removeAttribute("data-theme"):e.dataset.theme=S.me.theme};
const key=v=>v.w.trim().toLowerCase()+"|"+v.l;
const r=()=>{save();render()};
const addV=o=>{if(S.vocab.some(v=>key(v)===key(o))){toast("Already in Vocabulary");return}S.vocab.unshift({id:Date.now()*1000+Math.floor(Math.random()*1000),d:"",e:"",s:"Learning",...o});r();toast("Saved to Vocabulary")};
const V={};
V.home=()=>`<h2>Home</h2><div class="c"><textarea id="np" rows="2" maxlength="280" placeholder="Share something with the world…"></textarea><button class="b" data-a="post" style="margin-top:6px">Post</button></div><p class="s">Demo feed: sample accounts are not real people.</p>`+S.posts.map(p=>{const w=u(p.u),c=S.cm[p.id]||[],l=S.liked.includes(p.id);return `<div class="c"><div class="row">${av(w.n)}<b>${E(w.n)}</b>${p.u!=="me"?`<span class="s">demo</span>`:""}<button class="b g" style="margin-left:auto" data-a="prof" data-i="${p.u}">Open profile</button></div><p>${E(p.x)}</p><div class="row"><button class="b g" data-a="like" data-i="${p.id}">${l?"♥":"♡"} ${p.lk+(l?1:0)}</button><button class="b g" data-a="cmt" data-i="${p.id}">💬 ${c.length}</button><button class="b g" data-a="sv" data-i="${p.id}">${S.saved.includes(p.id)?"★ Saved":"☆ Save"}</button></div>${X.cm===p.id?c.map(x=>`<div class="m">${E(x)}</div>`).join("")+`<form data-f="cm" data-i="${p.id}" class="row"><input name="x" maxlength="200" placeholder="Write a comment" required><button class="b">Send</button></form>`:""}</div>`}).join("");
const exl=()=>{let L;if(X.ex==="friends")L=U.filter(x=>S.friends.includes(x.id));else if(X.ex==="following")L=U.filter(x=>S.follow.includes(x.id));else if(X.ex==="requests")L=U.filter(x=>S.reqs.includes(x.id));else{const q=X.q.toLowerCase();L=U.filter(x=>(!q||(x.n+" "+x.i.join(" ")).toLowerCase().includes(q))&&(!X.lg||x.nat===X.lg||x.lrn.includes(X.lg)))}
return (X.ex==="discover"?`<p class="s">Demo profiles. Follows and requests are saved on this device and don’t contact real people.</p>`:"")+(L.map(x=>{const f=S.friends.includes(x.id),fo=S.follow.includes(x.id);return `<div class="c"><div class="row">${av(x.n)}<div><b>${E(x.n)}</b> <span class="s">${x.c}</span><div class="s">Native: ${x.nat}. Learning: ${x.lrn.join(", ")}</div></div></div><div>${tag(x.i)}</div><div class="row" style="margin-top:8px">`+(X.ex==="requests"?`<button class="b" data-a="acc" data-i="${x.id}">Accept</button><button class="b g" data-a="dec" data-i="${x.id}">Decline</button>`:`<button class="b g" data-a="fol" data-i="${x.id}">${fo?"Unfollow":"Follow"}</button>${f?`<span class="t">Friends</span>`:S.sent.includes(x.id)?`<span class="s">Request sent (demo)</span>`:`<button class="b g" data-a="req" data-i="${x.id}">Add friend</button>`}<button class="b" data-a="msg" data-i="${x.id}">Message</button>`)+`</div></div>`}).join("")||`<div class="c s">Nothing here yet. Try the Discover tab.</div>`)};
V.explore=()=>`<h2>Explore</h2><div class="row">${["discover","friends","following","requests"].map(k=>`<button class="b ${X.ex===k?"":"g"}" data-a="ex" data-i="${k}">${k[0].toUpperCase()+k.slice(1)}${k==="requests"&&S.reqs.length?" ("+S.reqs.length+")":""}</button>`).join("")}</div>`+(X.ex==="discover"?`<div class="row" style="margin-top:8px"><input id="q" placeholder="Search name or interest" value="${E(X.q)}"><select id="lg"><option value="">All languages</option>${opt(LG,X.lg)}</select></div>`:"")+`<div id="lst">${exl()}</div>`;
const mh=(m,k)=>{const key=X.chat+k,w=m.f==="me";return `<div class="m ${w?"me":""}"><div class="s">${E(u(m.f).n)}, ${m.at}${w?" (demo: not delivered)":X.so[key]?"":" (demo translation)"}</div><div>${E(!w&&!X.so[key]?m.t:m.o)}</div>${w?"":`<div class="row" style="margin-top:4px"><button class="b g" data-a="so" data-i="${key}">${X.so[key]?"Show translation":"Show original"}</button><button class="b g" data-a="cp" data-i="${k}">Copy</button><button class="b g" data-a="svm" data-i="${k}">Save to Vocabulary</button><button class="b g" data-a="ask" data-i="${k}">Ask AI Mentor</button></div>`}</div>`};
V.chats=()=>{const ids=Object.keys(S.chats),c=X.chat;return `<h2>Chats</h2><p class="s">Demo: messages stay on this device and are not delivered to real people.</p><div class="row">${ids.map(i=>`<button class="b ${c===i?"":"g"}" data-a="chat" data-i="${i}">${E(u(i).n)}</button>`).join("")||`<span class="s">No conversations yet. Start one from Explore.</span>`}</div>`+(c&&S.chats[c]?`<div class="c">`+(S.chats[c].map(mh).join("")||`<p class="s">No messages yet. Say hello!</p>`)+`</div><form data-f="send" class="row"><input name="x" maxlength="500" placeholder="Type a message" required autocomplete="off"><button class="b">Send</button></form>`:ids.length?`<div class="c s">Select a conversation above.</div>`:"")};
V.mentor=()=>{const M=S.mm,QA=[["explain","Explain a phrase"],["correct","Correct my sentence"],["practice","Practice a conversation"],["slang","Explain slang"]];return `<h2>AI Mentor</h2><p class="s">Demo mode: sample answers from a small built-in list. This is not a live AI.</p><div class="row"><select data-s="lang" aria-label="Language">${opt(LG,M.lang)}</select><select data-s="lv" aria-label="Level">${opt(["A1","A2","B1","B2","C1","C2"],M.lv)}</select><button class="b g" data-a="newm">New conversation</button></div><div class="row" style="margin:8px 0">${QA.map(q=>`<button class="b ${M.mode===q[0]?"":"g"}" data-a="mode" data-i="${q[0]}">${q[1]}</button>`).join("")}</div><div class="c"><div class="m">Hi! I’m your language mentor (demo). Pick a quick action, then type a phrase or sentence in ${M.lang}.</div>${S.mentor.map((m,k)=>`<div class="m ${m.r==="u"?"me":""}">${E(m.x).replace(/\n/g,"<br>")}${m.sv?`<div class="row" style="margin-top:4px"><button class="b g" data-a="svma" data-i="${k}">Save to Vocabulary</button></div>`:""}</div>`).join("")}</div><form data-f="ment" class="row"><input name="x" id="mi" maxlength="300" placeholder="${M.mode==="correct"?"Type a sentence to check":M.mode==="practice"?"Type a word or phrase to practice":"Type a phrase or word"}" value="${E(X.pre)}" required autocomplete="off"><button class="b">Send</button></form>`};
const mr=t=>{const M=S.mm,s=t.toLowerCase();
if(M.mode==="correct"){const c=t.replace(/\bi\b/g,"I").replace(/\bdont\b/gi,"don’t").replace(/\bI am agree\b/i,"I agree").replace(/\b(he|she) go\b/i,"$1 goes");return {x:c===t?"Demo check: I found no errors among the few patterns I know (lowercase “i”, “dont”, “I am agree”, “he go”). A real AI would check much more.":`Demo check, suggested: “${c}”\nI only catch a few common patterns here.`}}
if(M.mode==="practice"){const n=S.mentor.filter(m=>m.p).length;return {p:1,x:[`Let’s practice with “${t}” (${M.lv}). Write one short sentence using it in ${M.lang}.`,"Good! Now ask me a question that uses the same phrase.","Nice. Finally, use it in a reply to a friend.","Well done! Press “New conversation” to practice something else."][Math.min(n,3)]}}
const k=Object.keys(K).find(k=>s.includes(k));if(!k)return {x:"I don’t know that one yet. Demo mode only knows a few phrases, such as “break the ice”, “no worries”, “spill the tea”, “はじめまして” and “お疲れ様です”."};
const [l,tr,e,d]=K[k];return {x:`“${k}” (${l}): ${tr}.\n${d}\nExample: ${e}\nTip for ${M.lv}: ${["A1","A2"].includes(M.lv)?"learn it as one whole chunk.":"notice the tone and when it fits."}\nTry it: write your own sentence with it.`,sv:{w:k,l,t:tr,e}}};
const vl=()=>{const q=X.vq.toLowerCase();return S.vocab.filter(v=>(!q||(v.w+" "+v.t).toLowerCase().includes(q))&&(!X.vl||v.l===X.vl)&&(!X.vs||v.s===X.vs))};
const vh=()=>{const L=vl();let f="";if(X.fc){X.fi=L.length?(X.fi+L.length)%L.length:0;const c=L[X.fi];f=c?`<div class="c" style="text-align:center"><div class="s">Card ${X.fi+1} of ${L.length} (${E(c.l)})</div><h2>${E(c.w)}</h2>${X.rv?`<p><b>${E(c.t)}</b></p><p class="s">${E(c.e||c.d||"")}</p>`:`<button class="b g" data-a="rv">Reveal translation</button>`}<div class="row" style="justify-content:center;margin-top:8px"><button class="b g" data-a="fp">Previous</button><button class="b g" data-a="fn">Next</button></div><div class="row" style="justify-content:center;margin-top:8px"><button class="b" data-a="rem" data-i="${c.id}">Remembered</button><button class="b g" data-a="npr" data-i="${c.id}">Needs practice</button></div></div>`:`<div class="c s">No cards match this filter.</div>`}
return f+(L.map(v=>`<div class="c"><div class="row"><b>${E(v.w)}</b><span class="t">${E(v.l)}</span><span class="t" style="background:${v.s==="Learned"?"var(--li)":"#d9d2f7"}">${v.s}</span></div><div>${E(v.t)}</div><div class="s">${E(v.d)} ${E(v.e)}</div><div class="row" style="margin-top:6px"><button class="b g" data-a="ved" data-i="${v.id}">Edit</button><button class="b g" data-a="vdel" data-i="${v.id}">Delete</button><button class="b g" data-a="vst" data-i="${v.id}">Mark ${v.s==="Learned"?"Learning":"Learned"}</button><button class="b g" data-a="vpr" data-i="${v.id}">Practice with AI Mentor</button></div></div>`).join("")||`<div class="c s">${S.vocab.length?"No matches. Clear the search or filters.":"No saved words yet. Add one above, or save phrases from Chats and AI Mentor."}</div>`)};
V.vocab=()=>{const e=S.vocab.find(v=>v.id===X.ed)||{};return `<h2>Vocabulary</h2><form class="c" data-f="vocab"><b>${X.ed?"Edit entry":"Add entry"}</b><div class="row" style="margin-top:6px"><input name="w" maxlength="120" placeholder="Word or phrase" value="${E(e.w||"")}" required><select name="l" aria-label="Language">${opt(LG,e.l||S.mm.lang)}</select></div><input name="t" maxlength="160" placeholder="Translation" value="${E(e.t||"")}" required style="margin-top:6px"><input name="d" maxlength="200" placeholder="Explanation (optional)" value="${E(e.d||"")}" style="margin-top:6px"><input name="e" maxlength="200" placeholder="Example sentence (optional)" value="${E(e.e||"")}" style="margin-top:6px"><div class="row" style="margin-top:6px"><button class="b">${X.ed?"Save changes":"Add entry"}</button>${X.ed?`<button type="button" class="b g" data-a="ced">Cancel</button>`:""}</div></form><div class="row"><input id="vq" placeholder="Search" value="${E(X.vq)}"><select id="vL" aria-label="Language filter"><option value="">All languages</option>${opt([...new Set(S.vocab.map(v=>v.l))],X.vl)}</select><select id="vS" aria-label="Status filter"><option value="">All statuses</option>${opt(["Learning","Learned"],X.vs)}</select></div><button class="b" style="margin:8px 0" data-a="fc">${X.fc?"Close flashcards":"Start flashcards"}</button><div id="lst">${vh()}</div>`};
V.profile=()=>{const m=S.me,L=[...new Set([...m.learning,...S.vocab.map(v=>v.l)])],ln=S.vocab.filter(v=>v.s==="Learned").length;return `<h2>Profile</h2><div class="c"><div class="row">${av(m.name)}<div><b>${E(m.name)}</b><div class="s">${E(m.bio||"No bio yet")}</div></div></div><p class="s">Native: ${E(m.native)}. Learning: ${E(m.learning.join(", ")||"none yet")}</p><div>${tag(m.interests)}</div><button class="b g" style="margin-top:8px" data-a="pe">${X.pe?"Cancel":"Edit profile"}</button></div>`+(X.pe?`<form class="c" data-f="prof"><input name="name" maxlength="30" value="${E(m.name)}" required aria-label="Username"><textarea name="bio" rows="2" maxlength="160" placeholder="Bio" style="margin-top:6px">${E(m.bio)}</textarea><select name="nat" style="margin-top:6px" aria-label="Native language">${opt(LG,m.native)}</select><input name="lrn" placeholder="Learning languages, comma-separated" value="${E(m.learning.join(", "))}" style="margin-top:6px"><input name="int" placeholder="Interests, comma-separated" value="${E(m.interests.join(", "))}" style="margin-top:6px"><button class="b" style="margin-top:6px">Save profile</button></form>`:"")+`<div class="c" style="border-color:var(--pu)"><b>🛂 World Passport</b><div class="s">Your language journey so far</div><div style="margin:6px 0">${L.map(l=>`<span class="t">${E(l)}: ${S.vocab.filter(v=>v.l===l).length} words</span>`).join("")||`<span class="s">Add words to earn your first stamp.</span>`}</div><div class="s">${S.vocab.length} saved, ${ln} learned, ${Object.keys(S.chats).length} chats, ${S.friends.length} friends</div></div><div class="c"><b>Settings</b><div class="row" style="margin:6px 0">Appearance <select data-s="theme" aria-label="Appearance">${["auto","light","dark"].map(l=>`<option ${m.theme===l?"selected":""}>${l}</option>`).join("")}</select></div><label class="row"><input type="checkbox" data-s="pub" ${m.pub?"checked":""} style="width:auto"> Public profile <span class="s">(saved on this device; the demo has no public pages)</span></label><button class="b g" style="margin-top:8px" data-a="reset">Reset demo data</button></div>`};
const render=()=>{const t=R(),p=X.pre;$("nav").innerHTML=TB.map(b=>`<button class="${b[0]===t?"on":""}" data-a="go" data-i="${b[0]}" ${b[0]===t?'aria-current="page"':""}><b>${b[1]}</b>${b[2]}</button>`).join("");$("#app").innerHTML=`<div class="top">🌐 WorldLink</div>`+V[t]();document.title="WorldLink";if(t==="mentor"){X.pre="";if(p)$("#mi").focus()}};
const tg=(a,v)=>a.includes(v)?a.filter(x=>x!==v):[...a,v],setS=(i,s)=>{S.vocab.find(v=>v.id===+i).s=s;r()};
const A={go,
post(){const v=$("#np").value.trim();if(!v)return toast("Write something first");S.posts.unshift({id:Date.now(),u:"me",x:v,lk:0});r();toast("Posted")},
like(i){S.liked=tg(S.liked,+i);r()},sv(i){S.saved=tg(S.saved,+i);r()},cmt(i){X.cm=X.cm===+i?null:+i;render()},
prof(i){if(i==="me")return go("profile");X.ex="discover";X.q=u(i).n;X.lg="";go("explore");render()},
ex(i){X.ex=i;render()},fol(i){S.follow=tg(S.follow,i);r()},req(i){S.sent.push(i);r();toast("Request recorded (demo: no real person was contacted)")},
acc(i){S.friends.push(i);S.reqs=S.reqs.filter(x=>x!==i);r();toast("Friend added (demo)")},dec(i){S.reqs=S.reqs.filter(x=>x!==i);r()},
msg(i){S.chats[i]=S.chats[i]||[];X.chat=i;save();go("chats");render()},chat(i){X.chat=i;render()},so(i){X.so[i]=!X.so[i];render()},
